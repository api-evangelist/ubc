- aid: ubc:iec-api-gateway
  name: UBC Integration Enablement Centre API Gateway
  x-operator: institution
  description: >-
    UBC's enterprise API gateway, run by the Office of the CIO's Integration Enablement Centre
    against the University Data Model. The host is real and answers — api.ubc.ca returns a flat
    nginx 403 to any unentitled caller, and DNS resolves it through api.iec.it.ubc.ca to a
    MuleSoft Anypoint load balancer, so the gateway is UBC's tenant of Anypoint on UBC's own
    domain. Nothing about it is self-service: the API catalogue is a Confluence page behind
    UBC's login, and access to any individual API is granted through a Data Access Framework
    request raised as a ServiceNow ticket. No contract is saved here because none is published.
  humanURL: https://cio.ubc.ca/data-governance/integration-enablement-centre
  baseURL: https://api.ubc.ca
  tags:
  - Enterprise Integration
