aid: ubc
name: University of British Columbia
description: >-
  The University of British Columbia is a public research university with campuses in Vancouver
  and Kelowna, British Columbia, and a member of Canada's U15 research group. Its programmable
  footprint is real but narrow, and almost all of it sits in UBC Library rather than in central
  IT. UBC Library operates the Open Collections API over the university's digitized archival
  and research collections, a IIIF Presentation endpoint over the same items, and the Abacus
  research-data repository — a Dataverse 5.9 deployment on UBC's own infrastructure that also
  serves a live OAI-PMH archive emitting DataCite kernel-4 and DDI Codebook metadata. Central
  IT publishes exactly one machine-readable artifact to the open internet: the SAML metadata
  for UBC's own Shibboleth identity provider at authentication.ubc.ca. Everything else the
  Office of the CIO runs is deliberately closed — the Integration Enablement Centre's MuleSoft
  gateway answers at api.ubc.ca with a flat 403, its API catalogue sits behind UBC's Confluence
  login, and entitlement is granted per-API through a Data Access Framework request rather than
  a developer portal. There is no public course, timetable or registrar API; course planning
  moved into Workday and the community projects that fill the gap are student-built and not
  endorsed by the university. UBC has no central developer portal, no API changelog and no
  deprecation policy, and every ubc.ca host sits behind a bot defence that answers automated
  clients with an HTML block page carrying HTTP 200.
