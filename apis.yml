- aid: ubc:open-collections
  name: UBC Library Open Collections API
  x-operator: institution
  description: >-
    Public REST/JSON API over UBC Library's Open Collections — the university's digitized
    historical, archival and research holdings. Operated by UBC Library on UBC's own
    infrastructure; the search resource is backed by an ElasticSearch index and versioned by
    the query syntax it accepts. Reads need no credential at 10 requests per minute per IP; an
    email-registered key raises that to 200. Verified live 2026-08-19: /collections returned
    362 collections and /search/8.5?q=salmon returned real hits. CORRECTION: the previously
    catalogued endpoint /search/8.5/ (trailing slash) does not route — it answers HTTP 200 with
    "Missed Route" and was a soft-404 credited as a working API.
