additional_standards:
  description: >-
    Machine-readable standards UBC demonstrably serves that are not named by the education
    regime. Recorded for accuracy; they do not score.
  items:
  - id: iiif-presentation
    name: IIIF Presentation API
    status: conformant
    x-operator: institution
    evidence:
    - url: https://iiif.library.ubc.ca/presentation/cdm.arphotos.1-0031708/manifest
      status: 200
      detail: >-
        Returns a 10,560-byte application/json IIIF manifest for an Open Collections item, with
        label, viewingDirection, viewingHint and IRI-annotated metadata.
  - id: ddi-codebook
    name: DDI Codebook 2.5
    status: conformant
    x-operator: institution
    evidence:
    - url: https://abacus.library.ubc.ca/oai?verb=ListMetadataFormats
      status: 200
      detail: >-
        oai_ddi metadataPrefix with schema
        https://ddialliance.org/Specification/DDI-Codebook/2.5/XMLSchema/codebook.xsd.
  - id: dublin-core
    name: Dublin Core Terms (with EDM and DPLA class mappings)
    status: conformant
    x-operator: institution
    evidence:
    - url: https://oc-index.library.ubc.ca/collections/darwin/items/1.0000153
      status: 200
      detail: >-
        Every Open Collections item field carries an `iri` naming its property, e.g.
        http://purl.org/dc/terms/isPartOf with classmap dpla:SourceResource, and
        http://www.europeana.eu/schemas/edm/dataProvider.
