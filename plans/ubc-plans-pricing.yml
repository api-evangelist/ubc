source: >-
  Derived from UBC's own access statements: UBC Library Open Collections key registration and
  its documented 10/200 requests-per-minute tiers, Abacus Dataverse public read access, and the
  Office of the CIO's Data Access Framework request process at
  https://cio.ubc.ca/data-governance/data-governance-services/access-ubc-data. UBC publishes no
  pricing artifact.
x-operator: institution
