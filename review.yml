  - date: '2026-08-19'
    rating: 3
    summary: >-
      University-pipeline re-profile with operator attribution applied. UBC's open programmable
      footprint is real and it is almost entirely UBC Library's: the Open Collections API, an
      IIIF Presentation endpoint over the same items, the Abacus Dataverse 5.9 repository, and
      a working OAI-PMH 2.0 archive on abacus.library.ubc.ca emitting DataCite kernel-4 and DDI
      Codebook 2.5 metadata. Central IT's single open machine-readable artifact is the SAML
      metadata for UBC's own Shibboleth identity provider — a genuine institution-operated
      identity-federation surface that the June profile missed entirely. The enterprise layer is
      gated rather than absent: api.ubc.ca is live and returns a flat 403, resolving through
      api.iec.it.ubc.ca to a MuleSoft Anypoint load balancer, and the IEC's own API catalogue
      redirects to a Confluence login. Every surface here is institution-operated with one
      exception, status.it.ubc.ca, which is UBC's Atlassian Statuspage tenant and is now labelled
      as such. TWO CLAIMS FROM 2026-06-03 DID NOT SURVIVE RE-PROBING. The OAI-PMH endpoint
      recorded at open.library.ubc.ca/oai/request never served OAI-PMH — that host is an Angular
      SPA behind an F5 bot defence and returns the identical HTML shell with HTTP 200 for every
      path, including an invented control path. And the Open Collections search endpoint recorded
      as /search/8.5/?q=salmon is a soft-404: the trailing slash breaks routing and the body reads
      "Missed Route" under an HTTP 200. The working form is /search/8.5 without the slash. The
      apparent footprint also shrank by design: twenty-two apis[] entries, one per tag of a single
      Dataverse contract, were collapsed into the one surface they describe. No public course,
      timetable or registrar API exists — registration runs in Workday and the community course
      tools are student-built on non-UBC domains with no evidence of endorsement, so they are not
      credited. Expect the composite to fall; the June number counted one contract twenty-two
      times and credited an endpoint that does not route.
